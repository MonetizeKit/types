# Thin caller for the org reusable SDK CI.
# The Required Checks Gate job is defined HERE (not in the reusable workflow)
# so the branch-protection context name stays stable.
name: CI

on:
  push:
    branches: [main, delivery, development]
  pull_request:
    branches: [main, delivery, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: MonetizeKit/.github/.github/workflows/reusable-sdk-ci.yml@v1
    with:
      run-tests: false # @monetizekit/types has no test suite yet

  # Shadow-mode reviewer from MonetizeKit/.github: one advisory comment per PR,
  # never blocks (the reusable workflow is continue-on-error internally and
  # self-skips without a credential), and is not part of required-checks.
  # Model, tools and route come from the fleet agent-policy.json.
  shadow-review:
    name: Shadow Review (advisory)
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    # Canary: pinned to the org branch until MonetizeKit/.github#PR merges and v1 moves.
    uses: MonetizeKit/.github/.github/workflows/reusable-pr-review.yml@v1
    with:
      policy_ref: cursor/ai-native-sdlc-430f
    secrets: inherit

  required-checks:
    name: Required Checks Gate
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream jobs
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "CI failed or was cancelled: ${{ needs.ci.result }}"
            exit 1
          fi
